version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bndes_postgres
    environment:
      POSTGRES_DB: bndes_data
      POSTGRES_USER: bndes_user
      POSTGRES_PASSWORD: bndes_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - bndes_network

  # Banco separado para Airflow
  airflow-postgres:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - bndes_network

  # Redis para Airflow
  redis:
    image: redis:7
    container_name: airflow_redis
    networks:
      - bndes_network

  # Build da imagem customizada do Airflow
  airflow-build:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: bndes-airflow:latest
    command: ["echo", "Build completed"]

  # Airflow Webserver
  airflow-webserver:
    image: bndes-airflow:latest
    container_name: airflow_webserver
    depends_on:
      - airflow-postgres
      - redis
      - airflow-build
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      # Remote Logging Configuration (MinIO)
      AIRFLOW__LOGGING__REMOTE_LOGGING: 'true'
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: 's3://airflow-logs'
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: 'minio_s3'
      # MinIO/S3 Configuration
      AWS_ACCESS_KEY_ID: 'minioadmin'
      AWS_SECRET_ACCESS_KEY: 'minioadmin123'
      AIRFLOW__LOGGING__S3_LOG_FOLDER: 's3://airflow-logs'
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./libs:/opt/airflow/libs
      - ./config:/opt/airflow/config
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - bndes_network

  # Airflow Scheduler
  airflow-scheduler:
    image: bndes-airflow:latest
    container_name: airflow_scheduler
    depends_on:
      - airflow-postgres
      - redis
      - airflow-build
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      # Remote Logging Configuration (MinIO)
      AIRFLOW__LOGGING__REMOTE_LOGGING: 'true'
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: 's3://airflow-logs'
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: 'minio_s3'
      # MinIO/S3 Configuration
      AWS_ACCESS_KEY_ID: 'minioadmin'
      AWS_SECRET_ACCESS_KEY: 'minioadmin123'
      AIRFLOW__LOGGING__S3_LOG_FOLDER: 's3://airflow-logs'
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./libs:/opt/airflow/libs
      - ./config:/opt/airflow/config
    command: scheduler
    networks:
      - bndes_network

  # Airflow Worker
  airflow-worker:
    image: bndes-airflow:latest
    container_name: airflow_worker
    depends_on:
      - airflow-postgres
      - redis
      - airflow-build
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ''
      # Remote Logging Configuration (MinIO)
      AIRFLOW__LOGGING__REMOTE_LOGGING: 'true'
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: 's3://airflow-logs'
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: 'minio_s3'
      # MinIO/S3 Configuration
      AWS_ACCESS_KEY_ID: 'minioadmin'
      AWS_SECRET_ACCESS_KEY: 'minioadmin123'
      AIRFLOW__LOGGING__S3_LOG_FOLDER: 's3://airflow-logs'
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./libs:/opt/airflow/libs
      - ./config:/opt/airflow/config
    command: celery worker
    networks:
      - bndes_network

  # Airflow Init
  airflow-init:
    image: bndes-airflow:latest
    container_name: airflow_init
    depends_on:
      - airflow-postgres
      - minio
      - airflow-build
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      # Remote Logging Configuration (MinIO)
      AIRFLOW__LOGGING__REMOTE_LOGGING: 'true'
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: 's3://airflow-logs'
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: 'minio_s3'
      # MinIO/S3 Configuration
      AWS_ACCESS_KEY_ID: 'minioadmin'
      AWS_SECRET_ACCESS_KEY: 'minioadmin123'
      AIRFLOW__LOGGING__S3_LOG_FOLDER: 's3://airflow-logs'
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./libs:/opt/airflow/libs
      - ./config:/opt/airflow/config
    command: >
      bash -c "
        echo '🚀 Iniciando setup do Airflow...' &&
        echo '⏳ Aguardando PostgreSQL...' &&
        while ! nc -z airflow-postgres 5432; do sleep 1; done &&
        echo '⏳ Aguardando MinIO...' &&
        while ! nc -z minio 9000; do sleep 1; done &&
        echo '🗄️ Inicializando banco...' &&
        airflow db migrate &&
        echo '👤 Criando usuário admin...' &&
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin ||
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin --replace &&
        echo '🪣 Criando bucket para logs...' &&
        python3 -c 'import boto3; from botocore.exceptions import ClientError; s3=boto3.client(\"s3\", endpoint_url=\"http://minio:9000\", aws_access_key_id=\"minioadmin\", aws_secret_access_key=\"minioadmin123\", region_name=\"us-east-1\"); s3.create_bucket(Bucket=\"airflow-logs\") if not any(b[\"Name\"]==\"airflow-logs\" for b in s3.list_buckets()[\"Buckets\"]) else print(\"Bucket já existe\"); print(\"✅ Bucket configurado\")' &&
        echo '🔧 Configurando conexões...' &&
        python3 /opt/airflow/airflow_setup.py &&
        echo '✅ Setup do Airflow concluído!'
      "
    networks:
      - bndes_network



  # PostgreSQL dedicado para Metabase
  metabase-postgres:
    image: postgres:15
    container_name: metabase_postgres
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase123
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    networks:
      - bndes_network

  metabase:
    image: metabase/metabase:latest
    container_name: bndes_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase123
      MB_DB_HOST: metabase-postgres
      JAVA_TOOL_OPTIONS: "-Xmx1g"
      # Configurações automáticas para o banco BNDES
      MB_ADMIN_EMAIL: bndes_data@student.com
      MB_ADMIN_FIRST_NAME: BNDES
      MB_ADMIN_LAST_NAME: Data
      MB_ADMIN_PASSWORD: bndes_data123
      MB_SITE_NAME: BNDES Data Analytics
    depends_on:
      - metabase-postgres
      - postgres
    volumes:
      - metabase_data:/metabase-data
    networks:
      - bndes_network

  minio:
    image: minio/minio:latest
    container_name: bndes_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - bndes_network

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_logs:
  metabase_data:
  metabase_postgres_data:
  minio_data:

networks:
  bndes_network:
    driver: bridge 