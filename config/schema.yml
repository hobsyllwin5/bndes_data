  sergipe: "SE"
  tocantins: "TO"

# Tabela de informações geográficas dos estados
estados_info:
  table_name: "estados_info"
  columns:
    uf:
      type: "VARCHAR(2)"
      constraints: "PRIMARY KEY"
      description: "Código UF (AC, AL, AP, etc.)"
    nome_estado:
      type: "VARCHAR(50)"
      constraints: "NOT NULL"
      description: "Nome completo do estado"
    nome_capital:
      type: "VARCHAR(50)"
      constraints: "NOT NULL"
      description: "Nome da capital"
    latitude:
      type: "DECIMAL(10,7)"
      constraints: "NOT NULL"
      description: "Latitude da capital (coordenada geográfica)"
    longitude:
      type: "DECIMAL(10,7)"
      constraints: "NOT NULL"
      description: "Longitude da capital (coordenada geográfica)"
    regiao:
      type: "VARCHAR(20)"
      constraints: "NOT NULL"
      description: "Região (Norte, Nordeste, Centro-Oeste, Sudeste, Sul)"
    area_km2:
      type: "INTEGER"
      constraints: ""
      description: "Área do estado em km²"
  
  indexes:
    - name: "idx_estados_regiao"
      columns: ["regiao"]

