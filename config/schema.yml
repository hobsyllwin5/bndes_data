  acre: "AC"
  alagoas: "AL"
  amapa: "AP"
  amazonas: "AM"
  bahia: "BA"
  ceara: "CE"
  distrito_federal: "DF"
  espirito_santo: "ES"
  goias: "GO"
  maranhao: "MA"
  mato_grosso: "MT"
  mato_grosso_do_sul: "MS"
  minas_gerais: "MG"
  para: "PA"
  paraiba: "PB"
  parana: "PR"
  pernambuco: "PE"
  piaui: "PI"
  rio_de_janeiro: "RJ"
  rio_grande_do_norte: "RN"
  rio_grande_do_sul: "RS"
  rondonia: "RO"
  roraima: "RR"
