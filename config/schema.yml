# Configurações de transformação
transformacao:
  colunas_controle:
    - "_id"
    - "ano"
    - "mes"
    - "rank"
    - "updated_at"
  
  validacao:
    valor_minimo: 0
    valor_maximo: 999999999
    casas_decimais: 8
    
  formato_periodo:
    tipo: "date"  # YYYY-MM-DD
    exemplo: "1995-01-01"
 